# Configuración para producción (Docker)

# Server
server.port=8080

# Database - las variables vienen de docker-compose
spring.datasource.url=jdbc:postgresql://localhost:5432/moviemate
spring.datasource.username=${DB_POSTGRE_USERNAME}
spring.datasource.password=${DB_POSTGRE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# TMDB API
tmdb.api.key=${TMDB_API_KEY}
tmdb.api.base-url=${TMDB_API_BASE_URL:https://api.themoviedb.org/3}
tmdb.api.image-base-url=${TMDB_API_IMAGE_BASE_URL:https://image.tmdb.org/t/p}
tmdb.api.language=${TMDB_API_LANGUAGE:es-ES}

# CORS
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Logging
logging.level.root=INFO
logging.level.com.moviemate=INFO

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized