spring.application.name=moviemate-backend-test

# H2 en memoria simulando PostgreSQL
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# Server (para tests de contexto)
server.port=0

# JWT (valores fake solo para tests)
app.jwt.secret=fake-jwt-secret-for-tests
app.jwt.expiration=86400000

# Logging (se puede ajustar el nivel de logging para tests)
logging.level.com.moviemate=INFO
logging.level.org.springframework.security=INFO

# TMDB API (valores fake solo para tests)
tmdb.api.key=fake-test-key
tmdb.api.base-url=https://api.themoviedb.org/3
tmdb.api.image-base-url=https://image.tmdb.org/t/p
tmdb.api.language=es-ES
