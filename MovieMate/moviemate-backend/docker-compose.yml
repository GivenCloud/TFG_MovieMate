services:
  postgres:
    image: postgres:16-alpine
    container_name: moviemate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: moviemate
      POSTGRES_USER: ${DB_POSTGRE_USERNAME}
      POSTGRES_PASSWORD: ${DB_POSTGRE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - moviemate-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_POSTGRE_USERNAME} -d moviemate"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moviemate-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/moviemate
      SPRING_DATASOURCE_USERNAME: ${DB_POSTGRE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_POSTGRE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      TMDB_API_KEY: ${TMDB_API_KEY}
      TMDB_API_BASE_URL: https://api.themoviedb.org/3
      TMDB_API_IMAGE_BASE_URL: https://image.tmdb.org/t/p
      TMDB_API_LANGUAGE: es-ES
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: -Xms512m -Xmx1024m
    ports:
      - "8080:8080"
    networks:
      - moviemate-network

networks:
  moviemate-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local