apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "moviemate.backend.configMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "moviemate.labels" . | nindent 4 }}
data:
  # URL JDBC apunta al Service de PostgreSQL dentro del cluster
  SPRING_DATASOURCE_URL: "jdbc:postgresql://{{ include "moviemate.fullname" . }}-postgres:{{ .Values.postgres.service.port }}/{{ .Values.postgres.database }}"

  # TMDB
  TMDB_API_BASE_URL:       {{ .Values.backend.env.tmdbApiBaseUrl | quote }}
  TMDB_API_IMAGE_BASE_URL: {{ .Values.backend.env.tmdbApiImageBaseUrl | quote }}
  TMDB_API_LANGUAGE:       {{ .Values.backend.env.tmdbApiLanguage | quote }}

  # JWT (solo la expiración; el secret va en el Secret)
  JWT_EXPIRATION: {{ .Values.backend.env.jwtExpiration | quote }}

  # CORS — permite peticiones del frontend (mismo origen vía Ingress)
  # El frontend y el backend comparten el mismo host a través del Ingress,
  # por lo que el origen es https://<host> (o http:// si TLS está desactivado).
  {{- if .Values.ingress.tls.enabled }}
  CORS_ALLOWED_ORIGINS: "https://{{ .Values.ingress.host }}"
  {{- else }}
  CORS_ALLOWED_ORIGINS: "http://{{ .Values.ingress.host }}"
  {{- end }}

  # Spring
  SPRING_PROFILES_ACTIVE: {{ .Values.backend.env.springProfilesActive | quote }}
  JAVA_OPTS:               {{ .Values.backend.env.javaOpts | quote }}
