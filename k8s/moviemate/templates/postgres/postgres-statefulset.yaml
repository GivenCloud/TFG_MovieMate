apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "moviemate.fullname" . }}-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "moviemate.labels" . | nindent 4 }}
    {{- include "moviemate.postgres.selectorLabels" . | nindent 4 }}
spec:
  serviceName: {{ include "moviemate.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "moviemate.postgres.selectorLabels" . | nindent 6 }}
  # StatefulSet usa OnDelete para evitar pérdida de datos por rollingUpdate accidental
  updateStrategy:
    type: OnDelete
  template:
    metadata:
      labels:
        {{- include "moviemate.labels" . | nindent 8 }}
        {{- include "moviemate.postgres.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP

          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "moviemate.secretName" . }}
                  key: db-username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "moviemate.secretName" . }}
                  key: db-password
            # Directorio de datos — debe coincidir con el mountPath del PVC
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U $(POSTGRES_USER) -d $(POSTGRES_DB)
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 5

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U $(POSTGRES_USER) -d $(POSTGRES_DB)
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3

          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}

  # volumeClaimTemplates: Kubernetes crea el PVC automáticamente y lo asocia
  # al pod del StatefulSet. Al eliminar el StatefulSet, el PVC permanece
  # (protección de datos por defecto).
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.postgres.storage.storageClass }}
        storageClassName: {{ .Values.postgres.storage.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage.size }}
