apiVersion: v1
kind: Secret
metadata:
  name: {{ include "moviemate.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "moviemate.labels" . | nindent 4 }}
  annotations:
    # Helm no gestiona secretos de forma segura por defecto.
    # En producción considera: Sealed Secrets, External Secrets Operator o Vault.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  # Base de datos
  db-username: {{ .Values.secrets.dbUsername | quote }}
  db-password: {{ .Values.secrets.dbPassword | quote }}
  # JWT
  jwt-secret: {{ .Values.secrets.jwtSecret | quote }}
  # TMDB
  tmdb-api-key: {{ .Values.secrets.tmdbApiKey | quote }}
