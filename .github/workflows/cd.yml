name: CD — Build, Push & Deploy

# Solo se ejecuta al hacer push a main (merge de PR o push directo)
on:
  push:
    branches:
      - main

env:
  REGISTRY:       ghcr.io
  # github.repository = "username/repo-name"
  BACKEND_IMAGE:  ghcr.io/${{ github.repository_owner }}/moviemate-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/moviemate-frontend

jobs:

  # ── Tests rápidos antes de desplegar ──────────────────────────
  test:
    name: Tests pre-deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: MovieMate/moviemate-backend/pom.xml

      - name: Backend tests
        working-directory: MovieMate/moviemate-backend
        run: mvn test --batch-mode -Dspring.profiles.active=test

  # ── Construir y publicar imágenes en GHCR ─────────────────────
  build-and-push:
    name: Build & Push Docker images
    runs-on: ubuntu-latest
    needs: test

    # Permisos necesarios para publicar en GHCR con GITHUB_TOKEN
    permissions:
      contents: read
      packages: write

    outputs:
      # El SHA del commit se usa como tag de imagen para trazabilidad
      image-tag: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN es automático — no hace falta configurar ningún secret
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Backend ───────────────────────────────────────────────
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: MovieMate/moviemate-backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      # ── Frontend ──────────────────────────────────────────────
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: MovieMate/moviemate-frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          build-args: |
            VITE_API_BASE_URL=/api
            VITE_TMDB_IMAGE_BASE=https://image.tmdb.org/t/p
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # ── Deploy a Minikube (self-hosted runner en máquina local) ───
  # Requiere:
  #   1. Self-hosted runner registrado en este repo (Settings → Actions → Runners)
  #   2. Secret de Kubernetes para GHCR:
  #      kubectl create secret docker-registry ghcr-secret \
  #        --docker-server=ghcr.io \
  #        --docker-username=<github-user> \
  #        --docker-password=<PAT-read:packages> \
  #        --namespace moviemate
  deploy:
    name: Deploy to Minikube
    runs-on: self-hosted
    needs: build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy with Helm
        run: |
          helm upgrade --install moviemate ./k8s/moviemate \
            --namespace moviemate \
            --reuse-values \
            --set backend.image.repository=${{ env.BACKEND_IMAGE }} \
            --set backend.image.tag=${{ needs.build-and-push.outputs.image-tag }} \
            --set backend.image.pullPolicy=Always \
            --set frontend.image.repository=${{ env.FRONTEND_IMAGE }} \
            --set frontend.image.tag=${{ needs.build-and-push.outputs.image-tag }} \
            --set frontend.image.pullPolicy=Always \
            --set "imagePullSecrets[0].name=ghcr-secret" \
            --wait --timeout 5m

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/moviemate-backend -n moviemate --timeout=3m
          kubectl rollout status deployment/moviemate-frontend -n moviemate --timeout=3m
