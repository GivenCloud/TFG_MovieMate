name: CD — Build, Push & Deploy

# Solo se ejecuta al hacer push a main (merge de PR o push directo)
on:
  push:
    branches:
      - main

env:
  REGISTRY:       ghcr.io
  # github.repository = "username/repo-name"
  BACKEND_IMAGE:  ghcr.io/${{ github.repository_owner }}/moviemate-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/moviemate-frontend

jobs:

  # ── Tests rápidos antes de desplegar ──────────────────────────
  test:
    name: Tests pre-deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: MovieMate/moviemate-backend/pom.xml

      - name: Backend tests
        working-directory: MovieMate/moviemate-backend
        run: mvn test --batch-mode -Dspring.profiles.active=test

  # ── Construir y publicar imágenes en GHCR ─────────────────────
  build-and-push:
    name: Build & Push Docker images
    runs-on: ubuntu-latest
    needs: test

    # Permisos necesarios para publicar en GHCR con GITHUB_TOKEN
    permissions:
      contents: read
      packages: write

    outputs:
      # El SHA del commit se usa como tag de imagen para trazabilidad
      image-tag: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN es automático — no hace falta configurar ningún secret
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Backend ───────────────────────────────────────────────
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: MovieMate/moviemate-backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      # ── Frontend ──────────────────────────────────────────────
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: MovieMate/moviemate-frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          build-args: |
            VITE_API_BASE_URL=/api
            VITE_TMDB_IMAGE_BASE=https://image.tmdb.org/t/p
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

